<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>รายละเอียดเรื่อง — Visual Novel Studio</title>
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="home.css">
  <link rel="stylesheet" href="vendor/bootstrap-icons/bootstrap-icons.min.css">
  <style>
    .detail-wrap { max-width: 900px; margin: 24px auto; padding: 0 20px; }
    .detail-header {
      display: flex; gap: 20px; align-items: flex-start;
      background: var(--bg-card); border: 1px solid var(--border-light);
      border-radius: 16px; padding: 20px; box-shadow: var(--shadow-sm);
    }
    .detail-cover {
      width: 160px; flex: 0 0 160px; aspect-ratio: 4 / 3;
      border-radius: 12px; overflow: hidden; background: linear-gradient(135deg, var(--primary-light), var(--accent-indigo));
      display: flex; align-items: center; justify-content: center; color: rgba(255,255,255,.85); font-size: 40px;
    }
    .detail-cover img { width: 100%; height: 100%; object-fit: cover; }
    .detail-meta { flex: 1; min-width: 0; }
    .detail-title { font-size: 24px; font-weight: 700; margin: 0 0 8px; color: var(--text-primary); }
    .detail-desc { font-size: 14px; color: var(--text-secondary); line-height: 1.6; margin: 0; white-space: pre-wrap; }
    .detail-section-title {
      margin: 28px 0 12px; font-size: 18px; font-weight: 700; color: var(--text-primary);
      display: flex; align-items: center; gap: 8px;
    }
    .episode-row {
      display: flex; align-items: center; gap: 14px;
      background: var(--bg-card); border: 1px solid var(--border-light);
      border-radius: 12px; padding: 14px 16px; margin-bottom: 10px;
      transition: border-color .15s ease, transform .15s ease;
    }
    .episode-row:hover { border-color: var(--accent, #5b6cff); transform: translateY(-1px); }
    .episode-no {
      flex: 0 0 auto; width: 42px; height: 42px; border-radius: 10px;
      background: var(--accent, #5b6cff); color: #fff; font-weight: 700;
      display: flex; align-items: center; justify-content: center; font-size: 15px;
    }
    .episode-info { flex: 1; min-width: 0; }
    .episode-title { font-size: 15px; font-weight: 600; color: var(--text-primary); }
    .episode-sub { font-size: 12px; color: var(--text-secondary); margin-top: 2px; }
    .detail-back { display: inline-flex; align-items: center; gap: 6px; margin: 16px 0; color: var(--text-secondary); text-decoration: none; font-size: 14px; }
    .detail-back:hover { color: var(--accent, #5b6cff); }
  </style>
</head>
<body>

  <!-- ════ Topbar (ยืมโครงสร้างจาก home) ════ -->
  <header class="topbar home-topbar">
    <button class="hamburger" id="hamburgerBtn" aria-label="เปิดเมนู"><span class="bar"></span></button>
    <div class="title"><i class="bi bi-book-half"></i> Visual Novel Studio</div>
    <nav class="home-topnav">
      <a href="home.html"><i class="bi bi-house-door"></i> หน้าหลัก</a>
      <a href="#" id="studioLink"><i class="bi bi-speedometer2"></i> สตูดิโอ</a>
    </nav>
    <button class="home-icon-btn" id="settingsBtn" aria-label="ค่าตั้ง" title="ค่าตั้ง"><i class="bi bi-gear"></i></button>
    <div class="home-settings-menu hidden" id="settingsMenu" role="menu">
      <button class="home-settings-item hidden" id="loginBtn"><i class="bi bi-box-arrow-in-right"></i> เข้าสู่ระบบ</button>
      <button class="home-settings-item hidden" id="logoutBtn"><i class="bi bi-box-arrow-right"></i> ออกจากระบบ</button>
    </div>
  </header>

  <a class="detail-back" href="home.html" onclick="goBackToSource('/home.html'); return false;"><i class="bi bi-arrow-left"></i> กลับหน้าหลัก</a>

  <main class="home-main">
    <div class="detail-wrap">

      <!-- สถานะโหลด -->
      <div class="home-state" id="detailLoading">
        <div class="spinner"></div>
        <p>กำลังโหลดรายละเอียดเรื่อง...</p>
      </div>

      <!-- สถานะผิดพลาด / ไม่พบ -->
      <div class="home-state hidden" id="detailError">
        <i class="bi bi-exclamation-triangle"></i>
        <p id="detailErrorMsg">ไม่พบเรื่องนี้</p>
        <a class="btn-primary" href="home.html" onclick="goBackToSource('/home.html'); return false;"><i class="bi bi-house-door"></i> กลับหน้าหลัก</a>
      </div>

      <!-- เนื้อหารายละเอียด -->
      <div class="hidden" id="detailContent">
        <div class="detail-header">
          <div class="detail-cover" id="detailCover"></div>
          <div class="detail-meta">
            <h1 class="detail-title" id="detailTitle"></h1>
            <p class="detail-desc" id="detailDesc"></p>
          </div>
        </div>

        <h2 class="detail-section-title"><i class="bi bi-list-ol"></i> รายตอน (ที่เผยแพร่)</h2>
        <div id="episodeList"></div>
        <div class="home-state hidden" id="episodeEmpty">
          <i class="bi bi-inbox"></i>
          <p>เรื่องนี้ยังไม่มีตอนที่เผยแพร่</p>
        </div>
      </div>

    </div>
  </main>

  <!-- ===== Login Dialog (Google Sign-In) ===== -->
  <div id="login-modal-overlay" class="modal-overlay hidden">
    <div class="modal-box" role="dialog" aria-modal="true" style="text-align:center;">
      <div class="modal-icon info"><i class="bi bi-google"></i></div>
      <h3 class="modal-title">เข้าสู่ระบบ</h3>
      <p class="modal-message">กรุณาล็อกอินด้วยบัญชี Google เพื่อเล่นเกม</p>
      <div id="google-signin-btn" style="display:flex; justify-content:center; margin-top:16px;"></div>
    </div>
  </div>

  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script src="shared-auth.js"></script>
  <script src="story-detail.js"></script>
</body>
</html>
